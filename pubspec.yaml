name: sambung_ayat
description: Aplikasi Sambung Ayat dan Murajaah Al-Qur'an dengan murottal pilihan.
publish_to: 'none'
version: 2.8.0+15

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  record: ^6.2.0
  quran_whisper:
    path: packages/quran_whisper

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/quran.json
