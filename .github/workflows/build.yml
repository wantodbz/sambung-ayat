name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Siapkan proyek Android
        run: |
          flutter create --project-name sambung_ayat --org com.abusyafiq --platforms android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Ambil pustaka
        run: flutter pub get

      - name: Bangun APK
        run: flutter build apk --release

      - name: Beri nama APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SambungAyat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SambungAyat-apk
          path: SambungAyat.apk

      - name: Terbitkan rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Sambung Ayat v1.2.${{ github.run_number }}
          body: APK siap dipasang. Unduh berkas SambungAyat.apk di bawah ini.
          files: SambungAyat.apk
