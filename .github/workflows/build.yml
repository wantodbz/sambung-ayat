name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Siapkan proyek Android
        run: |
          bash tool/fetch_whisper.sh
          flutter create --project-name sambung_ayat --org com.abusyafiq --platforms android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Ambil pustaka
        run: flutter pub get

      - name: Bangun APK
        run: |
          set +e
          flutter build apk --release --build-number=${{ github.run_number }} > build.log 2>&1
          code=$?
          tail -60 build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error|Error|ERROR|What went wrong|FAILURE|failed|Exception|> " build.log | grep -v "^\s*$" | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build gagal::$msg"
          fi
          exit $code

      - name: Periksa target API
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          info=$("$AAPT2" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -oE "versionCode='[0-9]+'|versionName='[^']+'|targetSdkVersion:'[0-9]+'" | tr '\n' ' ')
          echo "::notice title=Manifest::$info"
          echo "$info" | grep -q "targetSdkVersion:'36'" || { echo "::error title=Target API::Target API bukan 36"; exit 1; }

      # AAB untuk Google Play. Bila secret KUNCI_UNGGAH ada, AAB langsung
      # ditandatangani kunci unggah; bila belum, AAB dibuat tanpa tanda tangan.
      - name: Bangun AAB (Google Play)
        env:
          KUNCI: ${{ secrets.KUNCI_UNGGAH }}
        run: |
          set +e
          if [ -n "$KUNCI" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in tool/signing/upload.p12.enc \
              -out "$RUNNER_TEMP/upload.p12" -pass env:KUNCI || { echo "::error title=Kunci unggah::Isi secret KUNCI_UNGGAH tidak cocok"; exit 1; }
            export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.p12" UPLOAD_KEY_PASSWORD="$KUNCI"
            out=SambungAyat.aab
          else
            export TANPA_TANDA_TANGAN=1
            out=SambungAyat-belum-ditandatangani.aab
            echo "::warning title=Kunci unggah belum diatur::Tambahkan secret KUNCI_UNGGAH agar AAB langsung siap diunggah ke Google Play."
          fi
          flutter build appbundle --release --build-number=${{ github.run_number }} > aab.log 2>&1
          code=$?
          rm -f "$RUNNER_TEMP/upload.p12"
          tail -30 aab.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error|Error|What went wrong|FAILURE|Exception" aab.log | head -30 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build AAB gagal::$msg"
            exit $code
          fi
          cp build/app/outputs/bundle/release/app-release.aab "$out"
          echo "AAB_FILE=$out" >> "$GITHUB_ENV"
          echo "::notice title=AAB::$out ($(stat -c %s "$out") byte)"

      - name: Beri nama APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SambungAyat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SambungAyat
          path: |
            SambungAyat.apk
            ${{ env.AAB_FILE }}

      - name: Terbitkan rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.${{ github.run_number }}
          name: Sambung Ayat v2.8.${{ github.run_number }}
          body: |
            - SambungAyat.apk: dipasang langsung di HP (uji).
            - Berkas .aab: untuk diunggah ke Google Play.
          files: |
            SambungAyat.apk
            ${{ env.AAB_FILE }}
