name: Uji Otomatis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Ambil pustaka
        run: |
          flutter pub get
          v=$(grep -A9 '^  speech_to_text:' pubspec.lock | grep 'version:' | head -1 | tr -d ' "')
          echo "::notice title=Versi speech_to_text::$v"

      - name: Periksa kode (analyzer)
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test > analyze.log 2>&1
          code=$?
          tail -30 analyze.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error •" analyze.log | head -30 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Kode tidak lolos analyzer::$msg"
          fi
          w=$(grep -cE "warning •" analyze.log)
          [ "$w" -gt 0 ] && echo "::warning title=Peringatan analyzer ($w)::$(grep -E 'warning •' analyze.log | head -10 | cut -c1-250 | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit $code

      - name: Jalankan uji
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          tail -100 test.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "Expected|Actual|Which|LOG:|Error|error:|EXCEPTION|overflowed|\[E\]|Some tests failed" test.log | head -50 | cut -c1-2500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Uji gagal::$msg"
          else
            echo "::notice title=Uji lulus::$(tail -1 test.log | cut -c1-200)"
          fi
          exit $code
